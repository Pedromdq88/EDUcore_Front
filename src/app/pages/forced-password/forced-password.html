<section class="password-setup"><div class="eco-card setup-card">
 <div class="setup-icon"><span class="material-icons-outlined">lock_reset</span></div>
 <p class="eyebrow">PRIMER INGRESO</p><h1>Protegé tu cuenta de tutor</h1>
 <p class="eco-muted">Ingresaste con tu DNI como clave temporal. Para acceder a tus estudiantes necesitás crear una contraseña personal segura; el DNI dejará de servir.</p>
 @if(error){<p class="eco-error" role="alert">{{error}}</p>}
 <form (ngSubmit)="save()">
 <label class="form-label">Contraseña inicial (DNI sin puntos)<input class="form-input" name="current" type="password" autocomplete="current-password" [(ngModel)]="current" required></label>
 <label class="form-label">Nueva contraseña (12 a 72 caracteres)<input class="form-input" name="next" type="password" autocomplete="new-password" [(ngModel)]="next" minlength="12" required></label>
 <label class="form-label">Repetir nueva contraseña<input class="form-input" name="confirm" type="password" autocomplete="new-password" [(ngModel)]="confirm" required></label>
 <button class="btn-primary" type="submit" [disabled]="busy">{{busy?'Actualizando…':'Cambiar contraseña y volver al login'}}</button>
 </form>
 </div></section>
